services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: museum_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed-demo.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
      - ./seed-demo-exhibits.sql:/docker-entrypoint-initdb.d/03-demo-exhibits.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U museum -d museum_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: museum_db
      DB_USER: museum
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yakutsk}
      VK_SYNC_KEY: ${VK_SYNC_KEY:-}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-238549299}
    volumes:
      - ./frontend:/var/www/html/frontend:ro
      - ./frontend/img/uploads:/var/www/html/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:80/api/funfact"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:-museum_pgdata}
