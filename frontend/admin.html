<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в админку</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 4rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1.5rem; background: #5D4037; color: white; border: none; cursor: pointer; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Вход для администратора</h1>
    <form id="login-form">
        <div class="form-group"><input type="text" id="username" placeholder="Логин" required></div>
        <div class="form-group"><input type="password" id="password" placeholder="Пароль" required></div>
        <button type="submit">Войти</button>
    </form>
    <div id="login-error" class="error"></div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('token', data.token);
                window.location.href = '/admin-panel.html';
            } else {
                document.getElementById('login-error').textContent = data.error || 'Ошибка входа';
            }
        });
    </script>
</body>
</html>
